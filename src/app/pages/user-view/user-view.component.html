<div class="container mt-5">
  @if (user) {
    <div class="card shadow-lg mx-auto" style="max-width: 800px; border-radius: 15px; overflow: hidden;">
      <div class="row g-0">
        <div class="col-md-5 bg-dark d-flex align-items-center justify-content-center p-4">
          <img [src]="user.image" class="img-fluid rounded-circle border border-4 border-white shadow" [alt]="user.first_name">
        </div>
        
        <div class="col-md-7">
          <div class="card-body p-4">
            <h2 class="card-title text-primary mb-3">{{ user.first_name }} {{ user.last_name }}</h2>
            
            <ul class="list-group list-group-flush mb-4">
              <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
              <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
              <li class="list-group-item"><strong>ID de Usuario:</strong> {{ user._id }}</li>
            </ul>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-start">
              <button class="btn btn-outline-secondary" routerLink="/home">
                Volver
              </button>

              <button class="btn btn-warning" [routerLink]="['/updateuser', user._id]">
                Actualizar
              </button>

              <button class="btn btn-danger" (click)="borrarUsuario()">Eliminar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Cargando ficha del usuario...</p>
    </div>
  }
</div>
