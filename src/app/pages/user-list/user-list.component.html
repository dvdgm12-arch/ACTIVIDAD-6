<div class="container mt-4">
    <h2 class="mb-4 text-center">Nuestra Comunidad de Usuarios</h2>

    <div class="row">
        @for (usuario of arrUsers; track usuario.id) {
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <app-user-card [myUser]="usuario"></app-user-card>
            </div>
        } @empty {
            <div class="col-12 text-center">
                <p>Cargando usuarios o lista vacía...</p>
            </div>
        }
    </div>
</div>
