@if (myUser) {
  <div class="card h-100 shadow-sm">
    <img [src]="myUser.image" class="card-img-top" [alt]="myUser.first_name">
    <div class="card-body">
      <h5 class="card-title">{{ myUser.first_name }} {{ myUser.last_name }}</h5>
      <p class="card-text text-muted">@{{ myUser.username }}</p>
      <p class="card-text small">Email: {{ myUser.email }}</p>
    </div>
    <div class="card-footer d-flex justify-content-between bg-white border-top-0">
      <a class="btn btn-outline-primary btn-sm" [routerLink]="['/user', myUser.id]">Ver Detalle</a>
      <div>
        <a class="btn btn-outline-warning btn-sm me-2" [routerLink]="['/updateuser', myUser.id]">Editar</a>
        <button class="btn btn-outline-danger btn-sm">Borrar</button>
      </div>
    </div>
  </div>
}
