<div class="card h-100 shadow-sm">
    <img src="https://via.placeholder.com/150" class="card-img-top" alt="Avatar del usuario">
    <div class="card-body">
        <h5 class="card-title">Nombre del Usuario</h5>
        <p class="card-text text-muted">@username</p>
        <p class="card-text">Email: usuario@ejemplo.com</p>
    </div>
    <div class="card-footer d-flex justify-content-between bg-white border-top-0">
        <a class="btn btn-outline-primary-btn-sm">Ver Detalle</a>
        <div>
            <button class="btn btn-outline-warning btn-sm me-2">Editar</button>
            <button class="btn btn-outline-danger btn-sm">Borrar</button>
        </div>
    </div>
</div>
